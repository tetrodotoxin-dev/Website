<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1320"
  height="1160"
  viewBox="0 0 1320 1160"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Tetrodotoxin semantic ecosystem</title>
  <desc id="description">
    Editable source diagram for the TTX foundation, branching language Dialects,
    and cross-domain tool and Terminal projections.
  </desc>

  <defs>
    <style><![CDATA[
      .frame { fill: #15151b; stroke: #2a292f; stroke-width: 1.5; }
      .node { fill: #0f0f14; stroke: #3a383f; stroke-width: 1.5; }
      .core { fill: #201317; stroke: #d85b5b; stroke-width: 1.8; }
      .workspace { fill: #171219; stroke: #b38a50; stroke-width: 1.8; }
      .observer { fill: #131319; stroke: #858086; stroke-width: 1.5; }
      .secondary { stroke: #b38a50; }
      .product { fill: #0c0c11; }
      .semantic-line { fill: none; stroke: #b83f3f; stroke-width: 2; }
      .dependency-line { fill: none; stroke: #b38a50; stroke-width: 2; marker-end: url(#dependency-arrow); }
      .projection-line { fill: none; stroke: #858086; stroke-width: 1.5; }
      .projection-arrow { marker-end: url(#projection-arrow); }
      .dashed { stroke-dasharray: 7 5; }
      .title { fill: #f4efed; font: 700 18px "Avenir Next", "Segoe UI", sans-serif; }
      .core-title { fill: #f4efed; font: 750 22px "Avenir Next", "Segoe UI", sans-serif; text-anchor: middle; }
      .detail { fill: #858086; font: 12px "SFMono-Regular", Consolas, monospace; }
      .detail-center { fill: #858086; font: 12px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
      .kicker { fill: #d7b37a; font: 700 12px "SFMono-Regular", Consolas, monospace; letter-spacing: 1.6px; }
      .kicker-center { fill: #d7b37a; font: 700 12px "SFMono-Regular", Consolas, monospace; letter-spacing: 1.6px; text-anchor: middle; }
    ]]></style>
    <marker id="dependency-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b38a50" />
    </marker>
    <marker id="projection-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#858086" />
    </marker>
  </defs>

  <g id="background" inkscape:groupmode="layer" inkscape:label="Background">
    <rect class="frame" x="1" y="1" width="1318" height="1158" rx="24" />
  </g>

  <g id="connectors" inkscape:groupmode="layer" inkscape:label="Connectors">
    <path class="semantic-line" d="M 660 146 V 198" />
    <path class="projection-line projection-arrow dashed" d="M 1000 250 H 892" />

    <path class="semantic-line" d="M 660 302 V 344" />
    <path class="semantic-line" d="M 155 344 H 1085" />
    <path class="semantic-line" d="M 155 344 V 382" />
    <path class="semantic-line" d="M 465 344 V 382" />
    <path class="semantic-line" d="M 775 344 V 382" />
    <path class="semantic-line" d="M 1085 344 V 382" />

    <path class="dependency-line" d="M 580 427 H 660" />

    <path class="semantic-line" d="M 775 472 V 522" />
    <path class="semantic-line" d="M 515 522 H 1125" />
    <path class="semantic-line" d="M 515 522 V 560" />
    <path class="semantic-line" d="M 815 522 V 560" />
    <path class="semantic-line" d="M 1125 522 V 560" />
    <path class="dependency-line" d="M 1085 472 V 515 H 1125 V 560" />
    <path class="semantic-line" d="M 815 650 V 716" />

    <path class="projection-line projection-arrow" d="M 430 250 H 24 V 862 H 430" />

    <path class="projection-line" d="M 660 954 V 996" />
    <path class="projection-line" d="M 155 996 H 1085" />
    <path class="projection-line" d="M 155 996 V 1032" />
    <path class="projection-line" d="M 465 996 V 1032" />
    <path class="projection-line" d="M 775 996 V 1032" />
    <path class="projection-line" d="M 1085 996 V 1032" />
  </g>

  <g id="semantic-foundation" inkscape:groupmode="layer" inkscape:label="Semantic foundation">
    <text class="kicker" x="40" y="34">SHARED SEMANTIC FOUNDATION</text>

    <g id="ttx">
      <rect class="core" x="480" y="54" width="360" height="92" rx="14" />
      <text class="kicker-center" x="660" y="82">HOST-NEUTRAL VOCABULARY</text>
      <text class="core-title" x="660" y="111">TTX</text>
      <text class="detail-center" x="660" y="132">identity · concepts · Packs · Layouts</text>
    </g>

    <g id="workspace">
      <rect class="workspace" x="430" y="198" width="460" height="104" rx="14" />
      <text class="kicker-center" x="660" y="228">LANGUAGE · ENVIRONMENT · SOURCE LIFETIME</text>
      <text class="core-title" x="660" y="259">Living Workspace</text>
      <text class="detail-center" x="660" y="282">Dialects · authorities · Associations · validation</text>
    </g>

    <g id="puffer">
      <rect class="node secondary" x="1000" y="205" width="220" height="90" rx="12" />
      <text class="title" x="1020" y="240">Puffer</text>
      <text class="detail" x="1020" y="267">CLI · LSP · publication</text>
    </g>
  </g>

  <g id="language-tree" inkscape:groupmode="layer" inkscape:label="Language tree">
    <text class="kicker" x="40" y="366">LANGUAGES BRANCH BY PURPOSE</text>

    <g id="c-frontend">
      <rect class="node secondary" x="40" y="382" width="230" height="90" rx="12" />
      <text class="title" x="62" y="417">C frontend</text>
      <text class="detail" x="62" y="444">independent C semantics</text>
    </g>

    <g id="package">
      <rect class="node" x="350" y="382" width="230" height="90" rx="12" />
      <text class="title" x="372" y="417">Package</text>
      <text class="detail" x="372" y="444">composition · persistence</text>
    </g>

    <g id="library">
      <rect class="node" x="660" y="382" width="230" height="90" rx="12" />
      <text class="title" x="682" y="417">Library</text>
      <text class="detail" x="682" y="444">types · values · execution</text>
    </g>

    <g id="render">
      <rect class="node" x="970" y="382" width="230" height="90" rx="12" />
      <text class="title" x="992" y="417">Render</text>
      <text class="detail" x="992" y="444">GPU contracts</text>
    </g>

    <g id="foreign">
      <rect class="node secondary" x="400" y="560" width="230" height="90" rx="12" />
      <text class="title" x="422" y="595">Foreign</text>
      <text class="detail" x="422" y="622">embedded ABI surface</text>
    </g>

    <g id="scene">
      <rect class="node" x="700" y="560" width="230" height="90" rx="12" />
      <text class="title" x="722" y="595">Scene</text>
      <text class="detail" x="722" y="622">state · signals · frames</text>
    </g>

    <g id="shader">
      <rect class="node" x="1010" y="560" width="230" height="90" rx="12" />
      <text class="title" x="1032" y="595">Shader</text>
      <text class="detail" x="1032" y="622">programs · uses Render</text>
    </g>

    <g id="app">
      <rect class="node" x="700" y="716" width="230" height="90" rx="12" />
      <text class="title" x="722" y="751">App</text>
      <text class="detail" x="722" y="778">lifecycle · uses Library</text>
    </g>
  </g>

  <g id="tool-tree" inkscape:groupmode="layer" inkscape:label="Tool and Terminal tree">
    <text class="kicker" x="40" y="842">TOOLS CROSS LANGUAGE BOUNDARIES</text>

    <g id="tools-and-terminals">
      <rect class="observer" x="430" y="862" width="460" height="92" rx="14" />
      <text class="kicker-center" x="660" y="891">INDEPENDENT CONSUMERS OF ONE GRAPH</text>
      <text class="core-title" x="660" y="923">Tools and Terminals</text>
    </g>

    <g id="live-tooling">
      <rect class="node product" x="40" y="1032" width="230" height="96" rx="12" />
      <text class="title" x="62" y="1066">Live tooling</text>
      <text class="detail" x="62" y="1092">LSP · Graph Text</text>
      <text class="detail" x="62" y="1112">partial observations</text>
    </g>

    <g id="persistence">
      <rect class="node product" x="350" y="1032" width="230" height="96" rx="12" />
      <text class="title" x="372" y="1066">Persistence</text>
      <text class="detail" x="372" y="1092">Package reconstruction</text>
      <text class="detail" x="372" y="1112">semantic machinery</text>
    </g>

    <g id="language-interop">
      <rect class="node product" x="660" y="1032" width="230" height="96" rx="12" />
      <text class="title" x="682" y="1066">Language interop</text>
      <text class="detail" x="682" y="1092">C · C++ bindings</text>
      <text class="detail" x="682" y="1112">public concept projection</text>
    </g>

    <g id="native-products">
      <rect class="node product" x="970" y="1032" width="230" height="96" rx="12" />
      <text class="title" x="992" y="1066">Native products</text>
      <text class="detail" x="992" y="1092">LLVM · Linker · runtime</text>
      <text class="detail" x="992" y="1112">SPIR-V · Vulkan</text>
    </g>
  </g>
</svg>
